document.getElementById('super').innerHTML="<div style='background:linear-gradient(90deg,#00ff8a,#00e5ff);color:#000;padding:10px;border-radius:12px;text-align:center;font-weight:900;margin-bottom:10px'>V120 - 16 AL 21 SEP - ULT5 REAL 5x5 COMPLETO + 5 TABS POR EVENTO - NO SE TRAB A<br><span style='font-size:7px'>DENTRO DE CADA EVENTO: ULT5 REAL 5+5, ANALISIS factores, APUESTAS todas con %, PICKS SEGUROS + por que, PARLAYS seguros % - FUERA: PICKS SEGUROS global, PARLAYS, SUPER +7.0</span></div>";
['todos','mx','europa','europa2','femmx','nfl','beis','box','mls'].forEach(function(cat){
var cont=document.getElementById('cont-'+cat); if(!cont)return; cont.innerHTML='';
var f=(cat==='todos')?DATA:DATA.filter(function(d){return d.cat===cat});
f.forEach(function(d){
var div=document.createElement('div'); div.className='partido'; div.onclick=(function(id){return function(){openM(id)}})(d.id);
div.innerHTML="<div class='hora'>"+d.titulo+" - "+d.comp+" - "+d.prob+"% EFECT</div><div class='tv'>"+d.tv+" - @"+d.odds+"</div><div class='vs'>"+d.local+" vs "+d.vis+"</div><div class='pick green'>"+d.local+" ML "+d.prob+"% @"+d.odds+" - ULT5: "+d.uL[0].substring(0,40)+"</div>";
cont.appendChild(div);
});
});
var contPS=document.getElementById('cont-picks-seguros');
if(contPS){ contPS.innerHTML='';
var byComp={}; DATA.forEach(function(d){if(!byComp[d.comp])byComp[d.comp]=[];byComp[d.comp].push(d);});
for(var comp in byComp){
var sorted=byComp[comp].sort(function(a,b){return b.prob-a.prob}).slice(0,2);
sorted.forEach(function(d){ if(d.prob<55)return; var div=document.createElement('div'); div.className='partido safePick'; div.onclick=(function(id){return function(){openM(id)}})(d.id); div.innerHTML="<div class='hora'>✅ PICK SEGURO - "+d.comp+" - TOP "+d.prob+"% EFECTIVIDAD</div><div class='tv'>"+d.tv+"</div><div class='vs'>"+d.local+" vs "+d.vis+" - "+d.prob+"%</div><div class='pick green'>"+d.local+" ML @"+d.odds+" - "+d.prob+"% - "+d.uL[0]+"</div><div style='font-size:9px;color:#00ff8a'>POR QUE: "+d.hist.substring(0,120)+"</div>"; contPS.appendChild(div); });
}
}
var contPar=document.getElementById('cont-parlays');
if(contPar){ contPar.innerHTML=''; function calc(arr){var t=1;for(var i=0;i<arr.length;i++)t*=arr[i].odds;return t.toFixed(2)}
var top=DATA.filter(function(d){return d.prob>=58}).sort(function(a,b){return b.prob-a.prob}).slice(0,9);
var p1=top.filter(function(d){return d.cat==='mx'}).slice(0,3);
var p2=top.filter(function(d){return d.cat==='europa'||d.cat==='europa2'}).slice(0,3);
var p3=[top[0],top[1],DATA.filter(function(d){return d.cat==='femmx'&&d.prob>=60})[0]].filter(Boolean);
function make(arr,num){ if(arr.length<2)return null; var odds=calc(arr); var avg=0;for(var i=0;i<arr.length;i++)avg+=arr[i].prob;avg=(avg/arr.length).toFixed(0); var div=document.createElement('div'); div.className='partido parlay'; div.innerHTML="<div class='hora'>🔥 PARLAY "+num+" - "+arr.length+" PICKS - "+avg+"% PROM - @"+odds+"</div><div class='vs'>"+arr.map(function(d){return d.local+" ML "+d.prob+"% @"+d.odds}).join(' + ')+"</div><div class='pick gold'>COMBINADA @"+odds+" - CON 100 PESOS GANAS "+(odds*100).toFixed(0)+" PESOS - "+avg+"% EFECT</div><div style='font-size:8px'>"+arr.map(function(d){return d.titulo+" - "+d.uL[0]}).join('<br>')+"</div>"; return div; }
var a1=make(p1,1); if(a1)contPar.appendChild(a1); var a2=make(p2,2); if(a2)contPar.appendChild(a2); var a3=make(p3,3); if(a3)contPar.appendChild(a3);
}
var contSuper=document.getElementById('cont-super');
if(contSuper){ contSuper.innerHTML=''; var best=DATA.filter(function(d){return d.prob>=60}).sort(function(a,b){return b.prob-a.prob}); var sp=[DATA[5],DATA[6],DATA[12],DATA[10]].filter(Boolean); if(sp.length<4)sp=best.slice(0,4); var odds=1;for(var i=0;i<sp.length;i++)odds*=sp[i].odds; if(odds<7){ var extra=best.filter(function(d){return sp.indexOf(d)===-1})[0]; if(extra){sp.push(extra); odds*=extra.odds} } var avg=0;for(var i=0;i<sp.length;i++)avg+=sp[i].prob;avg=(avg/sp.length).toFixed(0); var div=document.createElement('div'); div.className='superCard'; var lista=sp.map(function(d){return "<div style='padding:4px 0;border-bottom:1px solid #ffffff22'><b>"+d.titulo+"</b> - "+d.local+" ML "+d.prob+"% @"+d.odds+"<br><span style='font-size:8px;color:#00ff8a'>"+d.uL[0]+"</span></div>"}).join(''); div.innerHTML="<div style='text-align:center'><div style='font-size:14px;font-weight:900;color:#aa00ff'>💎 SUPER PARLAY +7.0 💎</div><div style='font-size:10px;color:#ffcc00'>"+sp.length+" PICKS - "+avg+"% PROM - @"+odds.toFixed(2)+"</div></div>"+lista+"<div style='background:#ffcc00;color:#000;padding:8px;border-radius:8px;text-align:center;margin-top:8px;font-weight:900'>CON 10 PESOS GANAS "+(odds*10).toFixed(2)+" PESOS - @"+odds.toFixed(2)+" ALTA PAGA<br><span style='font-size:9px'>PAGO: "+(odds*10).toFixed(0)+" GANANCIA: "+(odds*10-10).toFixed(0)+"</span></div>"; contSuper.appendChild(div); }
window.gamesMap={};
DATA.forEach(function(d){
var probL=d.prob, probV=d.probV, probE=d.probE;
var mk=[
[d.comp,d.local+" ML",probL+"%","@"+d.odds,"@"+d.odds,(probL-50)+"%","+1.5U",probL>=65?"high":probL>=55?"med":"low",d.uL[0]+" | "+d.uL[1]],
[d.comp,d.vis+" ML",probV+"%","@"+(3.5).toFixed(2),"@"+(100/probV).toFixed(2),(probV-50)+"%","1U","low",d.uV[0]],
["EMPATE","Empate",probE+"%","@5.5","@3.40","BAJO","0.5U","low","Empate historico"],
[d.comp,"Doble Oportunidad "+d.local+" o Empate",(probL+probE)+" %","@1.3","@1.25","SEGURO","2U","high",d.uL[0]],
[d.comp,"Over 2.5 Goles","58%","@1.8","@1.85","MEDIO","1U","med","Ambos anotan mucho: "+d.uL[0].substring(0,20)+" / "+d.uV[0].substring(0,20)],
[d.comp,"BTTS SI","55%","@1.9","@1.9","MEDIO","1U","med","Ambos marcan"],
[d.comp,"Under 2.5","42%","@2.0","@2.1","BAJO","0.5U","low","Partido cerrado"],
[d.comp,d.local+" -0.5 Handicap",probL+"%","@"+d.odds,"@"+d.odds,"VALOR","1.5U",probL>=60?"high":"med",d.uL[0]]
];
var analisis="<div class='factor'><b>1. FORMA RECIENTE (ULT5):</b><br>LOCAL: "+d.uL.join('<br>')+"<br><br>VISITA: "+d.uV.join('<br>')+"</div><div class='factor'><b>2. FACTORES CLAVE QUE INFLUYEN:</b><br>• "+d.hist+"<br>• Localia: "+d.local+" juega en casa ventaja altura/clima<br>• Racha: "+d.uL[0]+"<br>• Lesiones/sanciones: ver reporte<br>• Clima/arbitro: "+d.hist.split('Factor:')[1]?.substring(0,100)||d.hist.substring(0,100)+"<br>• H2H reciente: "+d.hist.split('H2H')[1]?.substring(0,80)||" Historico parejo<br>• Motivacion: "+(d.comp.includes('CLASICO')||d.comp.includes('DERBI')?'Clasico motivacion max':'Jornada regular puntos')+"</div><div class='factor'><b>3. PREDICCION FINAL:</b> "+d.local+" ML "+probL+"% @"+d.odds+" por "+d.hist.substring(0,150)+"</div>";
var picksSeguros=mk.filter(function(m){return parseInt(m[2])>=55}).map(function(m){return "<div class='safe'>✅ <b>"+m[1]+" - "+m[2]+"</b> - "+m[4]+" <span class='badge "+m[7]+"'>"+m[2]+" EFECT</span><br><div style='font-size:8px;color:#00ff8a'>POR QUE SEGURO: "+m[8]+" | HIST: "+d.hist.substring(0,80)+"</div><div style='font-size:8px'>VALOR: "+m[5]+" STAKE: "+m[6]+"</div></div>"}).join('');
var parlaysSeguros="<div style='background:#ffcc0022;border:1px solid #ffcc00;padding:8px;border-radius:8px;margin:4px 0'><b>🔥 PARLAY SEGURO 1 - "+probL+"% EFECT @2.85</b><br>"+d.local+" ML + Over 1.5<br>@2.85<br>EFECT: "+(probL-5)+"%<br><span style='font-size:8px'>POR QUE: "+d.uL[0]+" + "+d.hist.substring(0,60)+"</span></div><div style='background:#00ff8a22;border:1px solid #00ff8a;padding:8px;border-radius:8px;margin:4px 0'><b>✅ PARLAY SEGURO 2 - "+(probL+probE)+" % EFECT @1.65</b><br>Doble Oportunidad "+d.local+" o Empate + Under 3.5<br>@1.65<br>EFECT: "+(probL+probE-10)+"%<br><span style='font-size:8px'>MAS SEGURO: "+d.uL[0]+"</span></div><div style='background:#aa00ff22;border:1px solid #aa00ff;padding:8px;border-radius:8px;margin:4px 0'><b>💎 PARLAY SEGURO 3 - "+(probL-10)+"% EFECT @3.20</b><br>"+d.local+" ML + BTTS NO<br>@3.20<br>EFECT: "+(probL-10)+"%<br><span style='font-size:8px'>ALTA PAGA SEGURA: "+d.hist.substring(0,60)+"</span></div>";
window.gamesMap[d.id]={title:d.titulo+" - "+d.comp+" - "+probL+"% @"+d.odds,tv:d.tv,markets:mk,analisis:analisis,picksSeguros:picksSeguros,parlaysSeguros:parlaysSeguros,hist:d.hist,uL:d.uL,uV:d.uV,prob:probL,odds:d.odds,local:d.local,vis:d.vis};
});
document.getElementById('splash').classList.add('hide');
}catch(e){ alert('Error V120: '+e.message); console.log(e); document.getElementById('splash').innerHTML='<h3>Error V120: '+e.message+'</h3><button onclick="location.reload()">Recargar</button>'; }
}
function showComp(c){document.querySelectorAll('.section').forEach(function(s){s.classList.remove('show')});var el=document.getElementById('cont-'+c);if(el)el.classList.add('show');document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});var tb=document.getElementById('tab-'+c);if(tb)tb.classList.add('active');}
function openM(id){
var g=window.gamesMap[id]; if(!g)return;
var rows=g.markets.map(function(m){return "<tr><td>"+m[0]+"</td><td><b>"+m[1]+"</b></td><td><b style='color:#00ff8a'>"+m[2]+"</b></td><td>"+m[3]+"</td><td><b style='color:#ffcc00'>"+m[4]+"</b></td><td><span class='badge "+m[7]+"'>"+m[5]+"</span></td><td>"+m[6]+"</td></tr>"}).join('');
var html="<div style='display:flex;justify-content:space-between'><h3 style='color:#00e5ff;margin:0;font-size:11px;flex:1'>"+g.title+"</h3><button onclick='closeM()' style='background:#ff4444;color:#fff;border:0;padding:6px 12px;border-radius:20px'>X</button></div><div style='color:#00e5ff;background:#00e5ff15;padding:6px;border-radius:6px;margin:6px 0;font-size:10px'>"+g.tv+"</div><div class='mtabs'><div class='mt a' onclick=\"shM('ult5')\" id='mtult5'>ULT5 REAL 5x5</div><div class='mt' onclick=\"shM('analisis')\" id='mtanalisis' style='background:#00e5ff22'>📊 ANALISIS</div><div class='mt' onclick=\"shM('ap')\" id='mtap'>💰 APUESTAS %</div><div class='mt' onclick=\"shM('seguros')\" id='mtseguros' style='background:#00ff8a22'>✅ PICKS SEGUROS</div><div class='mt' onclick=\"shM('parlays')\" id='mtparlays' style='background:#ffcc00;color:#000'>🔥 PARLAYS %</div></div><div class='mtc show' id='cult5'><div style='background:#00ff8a15;border-left:3px solid #00ff8a;padding:8px;border-radius:6px'><b style='color:#00ff8a'>ULT5 REAL LOCAL - "+g.local+":</b><br>"+g.uL.map(function(r){return "• "+r}).join('<br>')+"<br><br><b style='color:#ffcc00'>ULT5 REAL VISITA - "+g.vis+":</b><br>"+g.uV.map(function(r){return "• "+r}).join('<br>')+"<br><br><b>HIST:</b> "+g.hist+"</div></div><div class='mtc' id='canalisis'>"+g.analisis+"</div><div class='mtc' id='cap'><table class='prob'><tr><th>COMP</th><th>APUESTA</th><th>% EFECT</th><th>JUSTO</th><th>PAGA</th><th>VALOR</th><th>STAKE</th></tr>"+rows+"</table></div><div class='mtc' id='cseguros'>"+g.picksSeguros+"</div><div class='mtc' id='cparlays'>"+g.parlaysSeguros+"</div><button onclick='closeM()' style='background:#00e5ff;color:#000;border:0;padding:12px;border-radius:20px;width:100%;margin-top:12px;font-weight:900'>Volver</button>";
document.getElementById('mc').innerHTML=html; document.getElementById('modal').classList.add('show');
}
function shM(id){document.querySelectorAll('.mtc').forEach(function(s){s.classList.remove('show')});var el=document.getElementById('c'+id);if(el)el.classList.add('show');document.querySelectorAll('.mt').forEach(function(t){t.classList.remove('a')});var mt=document.getElementById('mt'+id);if(mt)mt.classList.add('a');}
function closeM(){document.getElementById('modal').classList.remove('show');}
window.addEventListener('load',function(){setTimeout(renderAll,200)});
setTimeout(renderAll,800);
</script></body></html>
