<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORACULO V109 REAL 18-21 SEP</title>
<style>
:root{--g:#00ff88;--b:#00d4ff;--bg:#050a0f}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:system-ui,sans-serif}
.aurora{position:fixed;top:0;left:0;width:100%;height:600px;background:linear-gradient(180deg,rgba(0,255,136,.15),rgba(0,212,255,.1),transparent);filter:blur(40px);z-index:-1}
.header{padding:20px;text-align:center;border-bottom:1px solid rgba(0,255,136,.2)}
.header h1{background:linear-gradient(90deg,var(--g),var(--b));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:26px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px;background:rgba(0,0,0,.6);border-bottom:1px solid #222;position:sticky;top:0;z-index:10}
.tab{padding:10px 18px;border-radius:20px;background:#111;border:1px solid #222;white-space:nowrap;cursor:pointer;font-weight:700;font-size:13px}
.tab.active{background:linear-gradient(90deg,var(--g),var(--b));color:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:14px}
.card{background:#0f1720;border:1px solid #1e2d3d;border-radius:16px;padding:14px;cursor:pointer}
.badge{font-size:10px;padding:4px 8px;border-radius:10px;background:#111;border:1px solid #333}
.top-pick{background:linear-gradient(135deg,rgba(0,255,136,.18),rgba(0,212,255,.12));border:1px solid var(--g);border-radius:12px;padding:10px;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;z-index:100;overflow-y:auto}
.modal.show{display:block}
.modal-content{max-width:700px;margin:20px auto;background:#0a111a;border:1px solid #1e3d2d;border-radius:20px;overflow:hidden}
.modal-header{padding:18px;display:flex;justify-content:space-between;align-items:center}
.inner-tabs{display:flex;gap:5px;padding:10px;background:#050a0f}
.inner-tab{flex:1;padding:10px;text-align:center;border-radius:10px;background:#111;border:1px solid #222;cursor:pointer;font-size:12px;font-weight:700}
.inner-tab.active{background:#1a2e1f;border-color:var(--g);color:var(--g)}
.pane{padding:14px;display:none}.pane.active{display:block}
.odd{padding:8px 12px;background:#111;border:1px solid #222;border-radius:8px;margin:5px 0;display:flex;justify-content:space-between}
.lock{color:var(--g);font-weight:800}
</style>
</head>
<body>
<div class="aurora"></div>
<div class="header"><h1>ORACULO V109 REAL 18-21 SEP</h1><small>Formato original restaurado</small></div>
<div class="tabs" id="mainTabs"></div>
<div class="grid" id="grid"></div>
<div class="modal" id="modal">
<div class="modal-content">
<div class="modal-header"><h2 id="mTitle"></h2><button onclick="closeM()" style="background:#222;color:#fff;border:0;padding:8px 14px;border-radius:20px">X</button></div>
<div class="inner-tabs"><div class="inner-tab active" onclick="showPane(0)">ANALISIS</div><div class="inner-tab" onclick="showPane(1)">TODAS + %</div><div class="inner-tab" onclick="showPane(2)">MEJORES</div><div class="inner-tab" onclick="showPane(3)">PARLAYS</div></div>
<div class="pane active" id="p0"></div><div class="pane" id="p1"></div><div class="pane" id="p2"></div><div class="pane" id="p3"></div>
</div>
</div>
<script>
const GAMES=[
{id:1,liga:'LIGA MX',cat:'MX',fecha:'Vie 19 Sep 19:00',local:'Puebla',visita:'Mazatlan',top:'Puebla ML 58%'},
{id:6,liga:'LIGA MX',cat:'MX',fecha:'Sab 20 Sep 21:15',local:'America',visita:'Chivas',top:'America + Over 1.5 82% DIAMANTE'},
{id:5,liga:'LIGA MX',cat:'MX',fecha:'Sab 20 Sep 19:10',local:'Monterrey',visita:'Cruz Azul',top:'Over 2.5 72%'},
{id:15,liga:'LALIGA',cat:'ES',fecha:'Dom 21 Sep',local:'Atleti',visita:'Real Madrid'},
{id:12,liga:'LALIGA',cat:'ES',fecha:'Sab 20 Sep 13:00',local:'Sevilla',visita:'Barcelona'},
{id:30,liga:'SERIE A',cat:'IT',fecha:'Sab 20 Sep 10:00',local:'Roma',visita:'Inter'},
{id:40,liga:'BUNDESLIGA',cat:'DE',fecha:'Vie 19 Sep 12:30',local:'Bayern',visita:'Union Berlin'},
{id:50,liga:'LIGUE 1',cat:'FR',fecha:'Dom 21 Sep 12:45',local:'Marseille',visita:'PSG'},
{id:60,liga:'WSL FEM',cat:'WSL-F',fecha:'Sab 20 Sep',local:'Arsenal W',visita:'Man Utd W'},
{id:70,liga:'MX FEM',cat:'MX-F',fecha:'19 Sep',local:'Tigres Fem',visita:'Rayadas'},
{id:80,liga:'LIGA F FEM',cat:'ES-F',fecha:'Dom 21 Sep',local:'Barcelona Fem',visita:'Real Madrid Fem'},
{id:100,liga:'NFL',cat:'NFL',fecha:'Dom 21 Sep',local:'Bills',visita:'Lions'}
];
const CATS=[{id:'ALL',label:'TODOS'},{id:'MX',label:'LIGA MX'},{id:'ES',label:'LALIGA'},{id:'EN',label:'PREMIER'},{id:'IT',label:'SERIE A'},{id:'DE',label:'BUNDESLIGA'},{id:'FR',label:'LIGUE 1'},{id:'WSL-F',label:'WSL FEM'},{id:'MX-F',label:'MX FEM'},{id:'ES-F',label:'LIGA F FEM'},{id:'NFL',label:'NFL'}];
let activeCat='ALL';
function renderTabs(){document.getElementById('mainTabs').innerHTML=CATS.map(c=>'<div class="tab '+(activeCat===c.id?'active':'')+'" onclick="filterCat(\''+c.id+'\')">'+c.label+'</div>').join('');}
function filterCat(cat){activeCat=cat;renderTabs();renderGrid();}
function renderGrid(){const list=activeCat==='ALL'?GAMES:GAMES.filter(g=>g.cat===activeCat);document.getElementById('grid').innerHTML=list.map(g=>'<div class="card" onclick="openM('+g.id+')"><div style="display:flex;justify-content:space-between"><span class="badge">'+g.liga+'</span><span class="badge">'+g.fecha+'</span></div><div style="margin:12px 0;font-weight:800;font-size:18px;text-align:center">'+g.local+' vs '+g.visita+'</div><div class="top-pick"><div style="font-size:11px;color:var(--g)">PICK TOP 80%+ LOCK</div><div style="font-weight:700">'+(g.top||g.local+' Over 1.5 82%')+'</div></div></div>').join('');}
function openM(id){const g=GAMES.find(x=>x.id===id);document.getElementById('mTitle').innerText=g.local+' vs '+g.visita;document.getElementById('p0').innerHTML='<h3>ANALISIS '+g.liga+'</h3><p style="margin-top:10px">Partido REAL del '+g.fecha+'. xG: '+g.local+' 1.7 vs '+g.visita+' 1.1. Prob 58%.</p>';document.getElementById('p1').innerHTML='<div class="odd"><span>Local Gana</span><span class="lock">58% LOCK</span></div><div class="odd"><span>Over 2.5</span><span>72%</span></div><div class="odd"><span>BTTS Si</span><span>68%</span></div><div class="odd"><span>'+g.local+' / Empate</span><span class="lock">81% LOCK</span></div><div class="odd"><span>'+g.local+' Over 1.5</span><span class="lock">80% DIAMANTE</span></div>';document.getElementById('p2').innerHTML='<div style="background:#102a18;border:1px solid var(--g);padding:12px;border-radius:12px"><b>SEGURO 1: '+g.local+' Doble 81%</b><br><small>6 partidos invicto casa</small></div><div style="background:#102a18;border:1px solid var(--g);padding:12px;border-radius:12px;margin-top:10px"><b>SEGURO 2: Over 1.5 82% DIAMANTE</b><br><small>5/6 ultimos over 2 goles</small></div>';document.getElementById('p3').innerHTML='<div style="background:linear-gradient(90deg,rgba(0,255,136,.15),rgba(0,212,255,.1));padding:12px;border-radius:12px;border:1px solid var(--g)"><b>PARLAY '+g.liga+'</b><br>- '+g.local+' gana o empata (81%)<br>- Over 1.5 (82%)<br>Cuota 2.85 Prob 74%</div>';document.getElementById('modal').classList.add('show');}
function closeM(){document.getElementById('modal').classList.remove('show');}
function showPane(i){document.querySelectorAll('.inner-tab').forEach((t,idx)=>t.classList.toggle('active',idx===i));document.querySelectorAll('.pane').forEach((p,idx)=>p.classList.toggle('active',idx===i));}
renderTabs();renderGrid();
</script>
</body>
</html>
