function generar(){const cats={hoy:[],mx:[],fmx:[],europa:[],feur:[],nfl:[],ucl:[],uel:[],mls:[],beis:[],f1:[],combate:[]};for(let k in games){let g=games[k];let c=(g.liga||"mx").toLowerCase();if(c.includes("hoy"))cats.hoy.push({id:k,...g});else if(c=="mx")cats.mx.push({id:k,...g});else if(c=="fmx")cats.fmx.push({id:k,...g});else if(c=="europa")cats.europa.push({id:k,...g});else if(c=="feur")cats.feur.push({id:k,...g});else if(c=="nfl")cats.nfl.push({id:k,...g});else if(c=="ucl")cats.ucl.push({id:k,...g});else if(c=="uel")cats.uel.push({id:k,...g});else if(c.includes("mls"))cats.mls.push({id:k,...g});else if(c.includes("beis"))cats.beis.push({id:k,...g});else if(c=="f1")cats.f1.push({id:k,...g});else if(c=="combate")cats.combate.push({id:k,...g});else cats.mx.push({id:k,...g});}for(let cat in cats){let div=document.getElementById(cat);if(!div)continue;let html="";cats[cat].forEach(g=>{html+=`<div class="partido ${cat=='hoy'?'hoy':''}" onclick="openM('${g.id}')"><div class="hora">${g.title}</div><div class="tv">${g.tv}</div><div class="pick green">${g.mejor.pick} | ${g.mejor.valor} - TOCA PARA 4 PESTAÑAS + PARLAYS</div></div>`;});div.innerHTML=html;let tab=document.getElementById('t'+cat);if(tab){let base=tab.innerText.split('(')[0].trim();tab.innerText=`${base} (${cats[cat].length})`;}}}
function renderSuper(){let all=Object.values(games);let valorSort=[...all].sort((a,b)=>parseFloat(b.mejor.valor)-parseFloat(a.mejor.valor));let safePicks=[...all].sort((a,b)=>b.prob-a.prob).slice(0,2);let safeMomio=safePicks.reduce((acc,g)=>acc*(parseFloat(g.mejor.paga.replace("@",""))||1.2),1);document.getElementById('safe').innerHTML=`<h3 style="color:#00ff8a;text-align:center">🔒 80%+ @${safeMomio.toFixed(2)}</h3><div class="super-box"><div class="momio-big">@${safeMomio.toFixed(2)}</div>${safePicks.map(g=>`<div class="leg"><b>${g.mejor.pick}</b><br>${g.title}</div>`).join('')}</div>`;let boomPicks=valorSort.slice(0,3);let boomMomio=boomPicks.reduce((a,g)=>a*(parseFloat(g.mejor.paga.replace("@",""))||2),1);document.getElementById('boom').innerHTML=`<h3 style="color:#ff4400;text-align:center">💥 PEGA MACHIN @${boomMomio.toFixed(2)}</h3><div class="super-box"><div class="momio-big">@${boomMomio.toFixed(2)}</div>${boomPicks.map(g=>`<div class="leg"><b>${g.mejor.pick} - ${g.mejor.valor}</b><br>${g.title}</div>`).join('')}</div>`;document.getElementById('super').innerHTML=`<h3 style="color:#ffcc00;text-align:center">💎 SUPER PARLAY @${boomMomio.toFixed(2)}</h3><div class="super-box"><div class="momio-big">@${boomMomio.toFixed(2)}</div>${boomPicks.map(g=>`<div class="leg"><b>${g.mejor.pick}</b></div>`).join('')}</div>`;}

s=g.mercados.slice(0,2);mejores.forEach(m=>{h+=`<div class="mercado top" style="display:block"><div><b style="font-size:10px">🎯 ${m.op} - ${m.prob} - ${m.momio} - ${m.valor}</b></div><div style="font-size:8px;margin-top:6px;background:rgba(0,0,0,0.4);padding:6px;border-radius:6px"><b>💡 POR QUE:</b> ${m.porque}<br><br><b>📈 JUSTIFICACION:</b> Prob real ${m.prob} vs paga ${m.momio}. Justo ${m.justo} pero paga ${m.momio} = ${m.valor} valor.</div></div>`;});h+=`</div></div>`;h+=`<div class="panel" id="p-parlays"><div class="scan"><h4>🔥 PARLAYS ARMADOS POR EL SISTEMA - MISMO PARTIDO</h4><div style="font-size:7px;background:rgba(255,204,0,0.15);padding:6px;border-radius:6px;margin-bottom:8px">💡 El sistema combina 2-3 mercados del MISMO evento para subir momio manteniendo buen % de efectividad.</div>`;(g.parlays||[]).forEach(p=>{h+=`<div class="parlay-box"><div style="font-weight:900;font-size:10px;color:#ffcc00">${p.nombre} - ${p.momio} - ${p.prob} PROB</div><div style="font-size:8px;margin:6px 0">${p.legs.map(l=>`• ${l}`).join('<br>')}</div><div style="font-size:7px;background:rgba(0,0,0,0.5);padding:6px;border-radius:6px"><b>🧠 ANALISIS PARLAY:</b> ${p.analisis}</div><div style="text-align:center;margin-top:6px;font-weight:900;color:#00ff8a">Paga ${p.momio} | $100 -> $${(parseFloat(p.momio.replace('@',''))*100).toFixed(0)} | Prob ${p.prob}</div></div>`;});h+=`</div></div><button onclick="closeM()" style="background:#00e5ff;color:#000;border:0;padding:12px;border-radius:20px;font-weight:900;width:100%;margin-top:10px">Cerrar</button>`;document.getElementById('mc').innerHTML=h;document.getElementById('modal').classList.add('show');}
