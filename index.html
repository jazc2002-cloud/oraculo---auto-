function function contarOrig(l){return Object.values(games).filter(g=>g.liga===l).length}
function renderFiltros(){
 let h=""; ligas.forEach(l=>{
  let c=contar(l);
  h+=`<button onclick="setLiga('${l}')" id="btn_${l}" class="${currentLiga===l?'active':''}">${nombres[l]} (${c})</button>`;
 });
 document.getElementById('filtros').innerHTML=h;
}
function setLiga(l){currentLiga=l;renderFiltros();renderLista();}
function renderLista(){
 let html="";
 Object.entries(games).filter(([id,g])=>g.liga===currentLiga).forEach(([id,g])=>{
  html+=`<div class="card" onclick="openGame('${id}')"><b>${g.title}</b><br><small>${g.tv} | Prob ${g.prob}% | ${g.mejor.pick}</small></div>`;
 });
 if(!html) html=`<div style="text-align:center;padding:30px;color:#888">0 eventos - se llena auto</div>`;
 document.getElementById('lista').innerHTML=html;
}
function openGame(id){
 currentGame=games[id];
 document.getElementById('mtitle').innerText=currentGame.title;
 document.getElementById('mtv').innerText=currentGame.tv;
 document.getElementById('modal').style.display='block';
 showTab('todas');
}
function showTab(t){
 document.querySelectorAll('.tabm button').forEach(b=>b.classList.remove('active'));
 document.getElementById('bt_'+t).classList.add('active');
 let g=currentGame; let html="";
 if(t==='todas'){
  html=g.mercados.map(m=>`<div class="mercado ${m.top?'top':''}"><b>${m.op}</b> ${m.top?'🔥 TOP':''}<br>Prob: ${m.prob} | Momio: ${m.momio} | Justo: ${m.justo} | Valor: ${m.valor}<br><small>${m.porque}</small></div>`).join('');
 }
 if(t==='mejor'){
  html=g.mercados.filter(m=>m.top).map(m=>`<div class="mercado top"><b>${m.op}</b> 🔥 MEJOR<br>Prob: ${m.prob} | ${m.momio} | Valor: ${m.valor}<br>${m.porque}</div>`).join('');
 }
 if(t==='parlays'){
  html=g.parlays.map(p=>`<div class="mercado">Parlay ${p.picks} picks - ${p.momio} - Prob ${p.prob}</div>`).join('');
 }
 if(t==='marcador'){
  html='<h3>Probabilidad Exacta del Marcador con %</h3>'+g.marcadores.map(m=>`<div class="mercado ${m.top?'top':''}"><b>MARCADOR ${m.score}</b> ${m.top?'🔥 MÁS PROBABLE':''}<br>Probabilidad: ${m.prob} | Momio: ${m.momio} | Justo: ${m.justo} | Valor: ${m.valor}</div>`).join('');
 }
 document.getElementById('mercados').innerHTML=html;
}
