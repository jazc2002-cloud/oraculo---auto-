<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORACULO V72</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0;padding:10px}
#nube{background:#00ff88;color:#000;padding:10px;border-radius:10px;text-align:center;font-weight:bold;margin-bottom:10px}
.tabs{display:flex;gap:5px;overflow-x:auto;margin-bottom:10px;padding-bottom:5px}
.tabs button{background:#222;color:#fff;border:1px solid #444;padding:8px 12px;border-radius:20px;white-space:nowrap;cursor:pointer}
.tabs button.active{background:#00ff88;color:#000;font-weight:bold}
.card{background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:12px;margin:8px 0;cursor:pointer}
.card:hover{border-color:#00ff88}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);overflow:auto;padding:15px;z-index:99}
.modal-content{background:#1a1a1a;padding:15px;border-radius:10px;max-width:600px;margin:auto}
.tabm{display:flex;gap:5px;margin:12px 0;overflow:auto}
.tabm button{background:#333;color:#fff;border:none;padding:8px 12px;border-radius:15px;cursor:pointer;white-space:nowrap}
.tabm button.active{background:gold;color:#000;font-weight:bold}
.mercado{border:1px solid #444;padding:10px;margin:8px 0;border-radius:8px}
.mercado.top{border-color:gold;background:#222}
</style>
</head>
<body>
<div id="nube">✅ V72 CARGANDO...</div>
<div class="tabs" id="filtros"></div>
<div id="lista"></div>
<div class="modal" id="modal"><div class="modal-content">
<button onclick="document.getElementById('modal').style.display='none'" style="float:right;background:#333;color:#fff;border:none;padding:8px 12px;border-radius:10px">X Cerrar</button>
<h2 id="mtitle"></h2>
<div id="mtv" style="color:#00ff88;margin-bottom:10px"></div>
<div class="tabm">
<button onclick="showTab('todas')" id="bt_todas" class="active">TODAS+%</button>
<button onclick="showTab('mejor')" id="bt_mejor">MEJOR</button>
<button onclick="showTab('parlays')" id="bt_parlays">PARLAYS</button>
<button onclick="showTab('marcador')" id="bt_marcador">MARCADOR EXACTO</button>
</div>
<div id="mercados"></div>
</div></div>
<script>
const ligas=["hoy","mx","mx_fem","europa","euro_fem","nfl","ucl","uel","mls","beis","f1","box"];
const nombres={"hoy":"🔴 HOY","mx":"MX J7-J8","mx_fem":"MX FEM J9-J10","europa":"EUROPA","euro_fem":"EURO FEM","nfl":"NFL S2-S3","ucl":"UCL J1-J2","uel":"UEL J1-J2","mls":"MLS","beis":"BEIS FINAL","f1":"F1 BAKU","box":"BOX/UFC"};
let currentLiga="hoy",currentGame=null;
const games={};
function contar(l){return Object.values(games).filter(g=>g.liga===l).length}
function renderFiltros(){
 let h=""; ligas.forEach(l=>{
  let c=contar(l);
  h+=`<button onclick="setLiga('${l}')" id="btn_${l}" class="${currentLiga===l?'active':''}">${nombres[l]} (${c})</button>`;
 });
 document.getElementById('filtros').innerHTML=h;
}
function setLiga(l){currentLiga=l;renderFiltros();renderLista();}
function renderLista(){
 let html="";
 Object.entries(games).filter(([id,g])=>g.liga===currentLiga).forEach(([id,g])=>{
  html+=`<div class="card" onclick="openGame('${id}')"><b>${g.title}</b><br><small>${g.tv} | Prob ${g.prob}% | ${g.mejor.pick}</small></div>`;
 });
 if(!html) html=`<div style="text-align:center;padding:30px;color:#888">0 eventos - se llena auto</div>`;
 document.getElementById('lista').innerHTML=html;
}
function openGame(id){
 currentGame=games[id];
 document.getElementById('mtitle').innerText=currentGame.title;
 document.getElementById('mtv').innerText=currentGame.tv;
 document.getElementById('modal').style.display='block';
 showTab('todas');
}
function showTab(t){
 document.querySelectorAll('.tabm button').forEach(b=>b.classList.remove('active'));
 document.getElementById('bt_'+t).classList.add('active');
 let g=currentGame; let html="";
 if(t==='todas'){
  html=g.mercados.map(m=>`<div class="mercado ${m.top?'top':''}"><b>${m.op}</b> ${m.top?'🔥 TOP':''}<br>Prob: ${m.prob} | Momio: ${m.momio} | Justo: ${m.justo} | Valor: ${m.valor}<br><small>${m.porque}</small></div>`).join('');
 }
 if(t==='mejor'){
  html=g.mercados.filter(m=>m.top).map(m=>`<div class="mercado top"><b>${m.op}</b> 🔥 MEJOR<br>Prob: ${m.prob} | ${m.momio} | Valor: ${m.valor}<br>${m.porque}</div>`).join('');
 }
 if(t==='parlays'){
  html=g.parlays.map(p=>`<div class="mercado">Parlay ${p.picks} picks - ${p.momio} - Prob ${p.prob}</div>`).join('');
 }
 if(t==='marcador'){
  html='<h3>Probabilidad Exacta del Marcador con %</h3>'+g.marcadores.map(m=>`<div class="mercado ${m.top?'top':''}"><b>MARCADOR ${m.score}</b> ${m.top?'🔥 MÁS PROBABLE':''}<br>Probabilidad: ${m.prob} | Momio: ${m.momio} | Justo: ${m.justo} | Valor: ${m.valor}</div>`).join('');
 }
 document.getElementById('mercados').innerHTML=html;
}
renderFiltros();renderLista();
</script>
</body>
</html>
