<script>
var games = JSON.parse(document.getElementById('games-data').textContent);
var current="HOY";

function renderLista(){var list=Object.entries(games); if(current==='HOY') list=list.filter(e=>e[1].liga_hoy==='HOY'); else if(current!=='TODOS' && current!=='SUPER') list=list.filter(e=>e[1].liga===current); var html=''; list.forEach(e=>{var id=e[0]; var g=e[1]; html+=`<div class="card-outer"><div class="card-top">🔴 ${g.title.toUpperCase()}</div><div class="card-mid"><span>📺 ${g.tv}</span><span class="badge-ev">${g.ev} REAL</span></div><div class="card-bot" onclick="openG('${id}')">${g.home.toUpperCase()} ML ${g.momio} ${g.prob}% - ${g.liga} - TOCA 4 PESTAÑAS</div></div>`;}); document.getElementById('lista').innerHTML=html;}
function renderSuper(){var top=Object.entries(games).sort((a,b)=>b[1].prob-a[1].prob).slice(0,5); var mom=1; top.forEach(e=>{mom*=parseFloat(e[1].momio.replace('@',''))}); var h=`<div class="superparlay"><h3 style="color:#ffcc00">🏆 SUPER PARLAY 12-21 SEP - TODAS LIGAS</h3>`; top.forEach(e=>{h+=`<div>✅ ${e[1].title} ${e[1].momio} (${e[1].prob}%)</div>`;}); h+=`<div style="margin-top:10px;font-weight:900;color:#ffcc00">MOMIO: @${mom.toFixed(2)} | $100 -> $${(mom*100).toFixed(0)}</div></div>`; document.getElementById('super_box').innerHTML=h; document.getElementById('lista').innerHTML='';}
function openG(id){var g=games[id]; document.getElementById('mtitle').innerText=g.title; document.getElementById('mtv').innerText=g.tv; document.getElementById('modal').style.display='block'; window.currentG=g; showTab('analisis');}
function showTab(t){document.querySelectorAll('.tabm button').forEach(b=>b.classList.remove('active')); document.getElementById('bt_'+t).classList.add('active'); document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active')); document.getElementById('panel_'+t).classList.add('active'); var g=window.currentG; if(!g) return;
if(t==='analisis'){var a=g.analisis; var h=`<div class="analisis-box"><h4>🤝 CARA A CARA (H2H)</h4>${a.h2h}</div><div class="analisis-box"><h4>📜 HISTORIA ENTRE AMBOS</h4>${a.historia}</div><div class="analisis-box"><h4>📈 ULTIMOS 5 EVENTOS DE CADA UNO</h4><b style="color:#00ff88">${a.ult5_home}</b><br><br><b style="color:#ff6b6b">${a.ult5_away}</b><br><br><small>Forma: ${g.home} ${a.forma_h} vs ${g.away} ${a.forma_a}</small></div><div class="analisis-box"><h4>⚠️ FACTORES IMPORTANTES QUE AFECTAN %</h4>${a.factores.map(f=>`• ${f}`).join('<br>')}<br><br><b style="color:#ffcc00">% FINAL AJUSTADO: ${g.prob}% REAL (con factores incluidos)</b></div>`; document.getElementById('panel_analisis').innerHTML=h;}
if(t==='apuestas'){var h=`<div style="color:#00ff88;font-size:10px;margin-bottom:8px">💰 ${g.mercados.length} TIPOS DE APUESTA CON % EFECTIVIDAD</div>`+g.mercados.map(m=>`<div class="mercado"><div><b>${m.op}</b> <small style="color:#888">${m.tipo}</small><br><small style="color:#ffcc00">% REAL: ${m.prob} | EFECTIVA: ${m.efec} | EV ${m.ev}</small></div><div style="text-align:right"><b style="color:#00ff88">${m.momio}</b><br><small>Justo ${m.justo}</small></div></div>`).join(''); document.getElementById('panel_apuestas').innerHTML=h;}
if(t==='mejores'){var h=`<div style="color:#ffcc00;font-size:10px;margin-bottom:8px">🔥 SOLO LAS 3 MEJORES APUESTAS CON % Y POR QUE ES LA MEJOR</div>`+g.mejores.map(m=>`<div style="background:linear-gradient(135deg,#1a1805,#2a2200);border:2px solid #ffcc00;border-radius:14px;padding:14px;margin:10px 0"><h3 style="color:#ffcc00;margin:0 0 6px 0;font-size:13px">${m.op} - ${m.prob} REAL | EFECTIVA ${m.efec} | ${m.ev}</h3><div style="font-size:12px;margin:6px 0">MOMIO: <b style="color:#00ff88">${m.momio}</b> | JUSTO: ${m.justo} | VALOR ALTO</div><p style="font-size:11px;line-height:1.4"><b style="color:#00ff88">POR QUE ES LA MEJOR APUESTA:</b><br>${m.porque_mejor}</p></div>`).join(''); document.getElementById('panel_mejores').innerHTML=h;}
if(t==='parlay'){var h=`<div style="color:#ffcc00;font-size:10px;margin-bottom:8px">🏆 MEJORES PARLAYS CON % EFECTIVIDAD</div>`+g.parlays.map(p=>`<div class="mercado" style="background:#1a1600;border-color:#ffcc00"><div><b style="color:#ffcc00">${p.picks}</b> <span style="background:#ffcc00;color:#000;padding:2px 6px;border-radius:8px;font-size:10px">${p.momio}</span><br><small style="color:#ffcc99">${p.detalle}</small><br><small style="color:#00ff88">% REAL: ${p.prob} | EFECTIVA: ${p.efec}</small></div><div style="text-align:right"><b style="color:#ffcc00">${p.momio}</b></div></div>`).join(''); document.getElementById('panel_parlay').innerHTML=h;}
}
renderFiltros(); renderLista();
</script></body></html>
