<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oraculo Jolly V125 REAL</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial,sans-serif;padding:15px;margin:0}
h1{color:#00ff88;text-align:center;line-height:1.2;margin:10px 0}
h1 small{color:#888;font-size:16px;display:block;margin-top:5px}
.card{background:#1a1a1a;border:1px solid #333;border-radius:14px;padding:14px;margin:12px 0}
.momio{color:#ffcc00;font-weight:bold;font-size:18px}
.badge{background:#00ff88;color:#000;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:bold}
small{color:#999}
#partidos{max-width:500px;margin:0 auto}
</style>
</head>
<body>
<h1>🔮 ORACULO V125 REAL <small>17-21 SEP 2026 - MOMIOS EN VIVO</small></h1>
<div id="partidos">Cargando momios reales de Liga MX...</div>

<script>
// URL CORRECTA DE SU WORKER - SIN J
const WORKER_URL = "https://jolly-shadow-3045.jazc2002-cloud.workers.dev";

async function cargar(){
  const cont = document.getElementById("partidos");
  try{
    // 1. Intenta Liga MX
    let r = await fetch(WORKER_URL+"/?sport=soccer_mexico_ligamx");
    let data = await r.json();

    // Si no hay Liga MX, prueba EPL y Champions
    if(!data || data.length===0){
      cont.innerHTML = "Sin Liga MX hoy, buscando otras ligas...";
      let r2 = await fetch(WORKER_URL+"/?sport=soccer_epl");
      data = await r2.json();
    }

    if(!data || data.length===0){
      cont.innerHTML = "No hay datos. Revisa tu API KEY en Cloudflare. Respuesta: "+JSON.stringify(data).slice(0,200);
      return;
    }

    let html = "";
    data.slice(0,15).forEach(j=>{
      const bk = j.bookmakers[0];
      if(!bk) return;
      const mk = bk.markets[0]?.outcomes || [];
      html+=`<div class="card">
        <b>${j.home_team} vs ${j.away_team}</b> <span class="badge">${bk.title||'Bookie'}</span><br><br>
        ${mk.map(o=>`${o.name}: <span class="momio">${o.price}</span>`).join(' &nbsp;|&nbsp; ')}<br><br>
        <small>📅 ${new Date(j.commence_time).toLocaleString('es-MX')} </small>
      </div>`;
    });
    cont.innerHTML = html || "Sin partidos disponibles";

  }catch(e){
    cont.innerHTML = `<div class="card" style="border-color:red">
    ❌ Error: ${e.message}<br><br>
    Worker usado:<br><small>${WORKER_URL}</small><br><br>
    1. Abre en otra pestaña: ${WORKER_URL}/?sport=soccer_mexico_ligamx<br>
    2. Si dice "Invalid API Key" -> falta poner la KEY en Cloudflare
    </div>`;
  }
}
cargar();
</script>
</body>
</html>
