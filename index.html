<script>
var games = JSON.parse(document.getElementById('games-data').textContent);
var current="HOY";
function counts(){var c={}; c["HOY"]=0; c["80%+"]=0; c["EUROPA"]=0; c["EURO FEM"]=0; c["F1 BAKU"]=0; Object.values(games).forEach(g=>{if(g.liga_hoy==="HOY") c["HOY"]++; if(g.prob>=80) c["80%+"]++; if(g.liga==="EUROPA") c["EUROPA"]++; if(g.liga==="EURO FEM") c["EURO FEM"]++; if(g.liga==="F1 BAKU") c["F1 BAKU"]++;}); return c;}
function renderFiltros(){var c=counts(); var h=''; h+=`<button class="btn-green ${current==='80%+'?'active':''}" onclick="setF('80%+')">🔥 80%+ (${c['80%+']})</button>`; h+=`<button class="btn-yellow ${current==='SUPER'?'active':''}" onclick="setF('SUPER')">🏆 SUPER</button>`; h+=`<button class="btn-blue ${current==='HOY'?'active':''}" onclick="setF('HOY')">🔴 HOY 12/09 (${c['HOY']})</button>`; h+=`<button class="btn-dark ${current==='EUROPA'?'active':''}" onclick="setF('EUROPA')">🇪🇺 EUROPA 5 LIGAS (${c['EUROPA']})</button>`; h+=`<button class="btn-dark ${current==='EURO FEM'?'active':''}" onclick="setF('EURO FEM')">👩 EUROPA FEM (${c['EURO FEM']})</button>`; h+=`<button class="btn-dark ${current==='F1 BAKU'?'active':''}" onclick="setF('F1 BAKU')">🏎️ F1 BAKU (${c['F1 BAKU']})</button>`; h+=`<button class="btn-dark ${current==='UCL J1-J2'?'active':''}" onclick="setF('UCL J1-J2')">🏆 UCL 12-21</button>`; h+=`<button class="btn-dark ${current==='MX J7-J8'?'active':''}" onclick="setF('MX J7-J8')">🇲🇽 MX</button>`; h+=`<button class="btn-dark ${current==='BOX/UFC'?'active':''}" onclick="setF('BOX/UFC')">🥊 BOX REAL</button>`; document.getElementById('filtros').innerHTML=h;}
function setF(f){current=f; renderFiltros(); if(f==='SUPER'){renderSuper();} else {document.getElementById('super_box').innerHTML=''; renderLista();} }
function renderLista(){var list=Object.entries(games); if(current==='HOY') list=list.filter(e=>e[1].liga_hoy==='HOY'); else if(current==='80%+') list=list.filter(e=>e[1].prob>=80); else if(current!=='TODOS') list=list.filter(e=>e[1].liga===current); var html=''; list.forEach(e=>{var id=e[0]; var g=e[1]; html+=`<div class="card-outer"><div class="card-top"><span class="dot"></span> ${g.title.toUpperCase()}</div><div class="card-mid"><span>📺 ${g.tv}</span><span class="badge-ev">${g.ev} REAL</span></div><div class="card-bot" onclick="openG('${id}')">${g.home.toUpperCase()} ML ${g.momio} ${g.prob}% - ${g.liga}</div></div>`;}); document.getElementById('lista').innerHTML=html||'<div style="text-align:center;padding:20px;color:#666">Sin eventos</div>';}
function renderSuper(){var top=Object.entries(games).sort((a,b)=>b[1].prob-a[1].prob).slice(0,5); var mom=1; top.forEach(e=>{mom*=parseFloat(e[1].momio.replace('@',''))}); var h=`<div class="superparlay"><h3 style="color:#ffcc00">🏆 SUPER PARLAY 12-21 SEP</h3>`; top.forEach(e=>{h+=`<div>✅ ${e[1].title} - ${e[1].momio} (${e[1].prob}%)</div>`;}); h+=`<div style="margin-top:10px;font-weight:900;color:#ffcc00">MOMIO: @${mom.toFixed(2)} | $100 -> $${(mom*100).toFixed(0)}</div></div>`; document.getElementById('super_box').innerHTML=h; document.getElementById('lista').innerHTML='';}
function openG(id){var g=games[id]; document.getElementById('mtitle').innerText=g.title; document.getElementById('mtv').innerText=g.tv+' | '+g.porque; document.getElementById('modal').style.display='block'; var h=''; g.mercados.forEach(m=>{h+=`<div class="mercado"><div><b>${m.op}</b><br><small>${m.porque}</small></div><div><b style="color:#00ff88">${m.momio}</b></div></div>`;}); document.getElementById('mercados').innerHTML=h;}
renderFiltros(); renderLista();
</script></body></html>
