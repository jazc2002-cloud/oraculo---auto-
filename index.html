let p1=topPicks.filter(d=>d.cat==='mx').slice(0,3);
let p2=topPicks.filter(d=>d.cat==='europa' || d.cat==='europa2').slice(0,3);
let p3=[...topPicks.slice(0,2),...DATA.filter(d=>d.cat==='femmx'&&d.prob>=60).slice(0,1)];
function calcOdds(arr){return arr.reduce((a,b)=>a*b.odds,1).toFixed(2)}
function renderParlay(arr,num){
let odds=calcOdds(arr);
let probAvg=(arr.reduce((a,b)=>a+b.prob,0)/arr.length).toFixed(0);
let div=document.createElement('div');
div.className='partido parlay';
div.innerHTML="<div class='hora'>🔥 PARLAY "+num+" - "+arr.length+" PICKS - "+probAvg+"% PROM EFECT - @"+odds+"</div><div class='vs'>"+arr.map(d=>d.local+" ML ("+d.prob+"% @"+d.odds+")").join(' + ')+"</div><div class='pick gold'>COMBINADA @"+odds+" - CON 100 PESOS GANAS "+(odds*100).toFixed(0)+" PESOS</div><div style='font-size:8px'>"+arr.map(d=>d.titulo+" "+d.uL[0]).join('<br>')+"</div>";
return div;
}
if(p1.length>=2)contPar.appendChild(renderParlay(p1,1));
if(p2.length>=2)contPar.appendChild(renderParlay(p2,2));
if(p3.length>=2)contPar.appendChild(renderParlay(p3,3));
}

let superPicks=[DATA.find(d=>d.id==='ev15'),DATA.find(d=>d.id==='ev7'),DATA.find(d=>d.id==='ev43'),DATA.find(d=>d.id==='ev27')].filter(Boolean);
if(superPicks.length<4)superPicks=best.slice(0,4);
let odds=superPicks.reduce((a,b)=>a*b.odds,1);
if(odds<7){
let extra=best.find(d=>!superPicks.includes(d)&&d.odds>=1.6);
if(extra)superPicks.push(extra);
odds=superPicks.reduce((a,b)=>a*b.odds,1);
}
let probAvg=(superPicks.reduce((a,b)=>a+b.prob,0)/superPicks.length).toFixed(0);
let div=document.createElement('div');

contSuper.appendChild(div);
}
