if(contPar){ contPar.innerHTML='';
function calc(arr){var t=1;for(var i=0;i<arr.length;i++)t*=arr[i].odds;return t.toFixed(2)}
var top=DATA.filter(function(d){return d.prob>=58}).sort(function(a,b){return b.prob-a.prob}).slice(0,9);
var p1=top.filter(function(d){return d.cat==='mx'}).slice(0,3);

function make(arr,num){
if(arr.length<2)return null;
var odds=calc(arr); var avg=0;for(var i=0;i<arr.length;i++)avg+=arr[i].prob;avg=(avg/arr.length).toFixed(0);

}

}
