<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oraculo Jolly V125</title>
<style>
body{background:#0f0f0f;color:#fff;font-family:Arial;padding:15px;margin:0}
h1{color:#00ff88;text-align:center}
.card{background:#1e1e1e;border:1px solid #333;border-radius:12px;padding:14px;margin:10px 0}
.momio{color:#ffcc00;font-weight:bold}
small{color:#999}
</style>
</head>
<body>
<h1>🔮 ORACULO V125 REAL<br><small>17-21 SEP 2026</small></h1>
<div id="partidos" style="text-align:center;padding:20px">Cargando momios reales...</div>

<script>
const WORKER_URL = "https://jolly-shadow-3045.jazc2002-cloud.workers.dev";
async function cargar(){
  try{
    const r = await fetch(WORKER_URL+"/?sport=soccer_mexico_ligamx");
    const data = await r.json();
    let html = "";
    if(!data ||!data.length){
      document.getElementById("partidos").innerHTML = "No hay partidos ahora mismo en Liga MX. Probando con Champions...";
      const r2 = await fetch(WORKER_URL+"/?sport=soccer_uefa_champs_league");
      const data2 = await r2.json();
      data.push(...data2);
    }
    data.forEach(j=>{
      const bk = j.bookmakers[0];
      const mk = bk?.markets[0]?.outcomes || [];
      html+=`<div class=card><b>${j.home_team} vs ${j.away_team}</b><br>
      ${mk.map(o=>`${o.name}: <span class=momio>${o.price}</span>`).join(' | ')}<br>
      <small>${new Date(j.commence_time).toLocaleString()} - ${bk?.title||''}</small></div>`;
    });
    document.getElementById("partidos").innerHTML = html || "Sin datos";
  }catch(e){
    document.getElementById("partidos").innerHTML = "Error cargando: "+e+"<br>Worker: "+WORKER_URL;
  }
}
cargar();
</script>
</body>
</html>
