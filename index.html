<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oráculo Auto</title>
<style>
body{font-family:sans-serif;background:#0f0f0f;color:#fff;padding:15px;margin:0}
h1{color:#00ff88;text-align:center}
.card{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:15px;margin:15px 0}
.tag{background:#00ff88;color:#000;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:bold}
.pick{font-size:18px;font-weight:bold;color:#00ff88;margin:8px 0}
.tv{color:#aaa;font-size:13px}
</style>
</head>
<body>
<h1>🔮 ORÁCULO AUTO</h1>
<p style="text-align:center;color:#aaa" id="fecha"></p>
<div id="app">Cargando partidos...</div>
<script>
document.getElementById('fecha').innerText = new Date().toLocaleString('es-MX');
fetch('./data.json?v='+Date.now())
.then(r=>r.json())
.then(data=>{
  let html='';
  for(let k in data){
    let p=data[k];
    html+=`<div class="card">
      <span class="tag">${p.liga||'MX'}</span>
      <h3>${p.title}</h3>
      <div class="tv">📺 ${p.tv||''}</div>
      <div class="pick">${p.mejor?.pick||''}</div>
      <div>Valor: ${p.mejor?.valor||''}</div>
      <p style="color:#ccc;font-size:14px">${p.scan?.analisis||''}</p>
    </div>`;
  }
  document.getElementById('app').innerHTML=html || 'Sin partidos hoy';
})
.catch(e=>{document.getElementById('app').innerHTML='Error cargando data.json - asegúrate que existe';});
</script>
</body>
</html>
