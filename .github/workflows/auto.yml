name: Auto Oraculo
on:
  push:
  schedule:
    - cron: '15 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python update.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@oraculo.com"
          git add index.html last_update.txt
          git commit -m "Auto V63 formato completo" || echo "Sin cambios"
          git push
