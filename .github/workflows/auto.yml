name: Auto Oraculo
on:
  schedule:
    - cron: '0 12,18,0 * * *'
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar gratis
        run: pip install requests
      - name: V100 COMPLETO AUTO GRATIS
        run: python update.py
      - name: Guardar
        run: |
          git config user.name "bot"
          git config user.email "bot@v100-completo.com"
          git add index.html data.json last_update.txt || git add.
          git diff --staged --quiet || git commit -m "V100 COMPLETO 57 eventos F1+EURO FEM"
          git push
