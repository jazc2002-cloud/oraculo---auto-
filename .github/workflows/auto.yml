name: oraculo---auto-
on:
  push:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install requests
        run: pip install requests
          
      - name: V100 COMPLETO AUTO GRATIS
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python update.py
          
      - name: Commit data.json
        run: |
          git config --global user.name 'oraculo-bot'
          git config --global user.email 'bot@oraculo.com'
          git add data.json
          git commit -m "auto update momios reales" || echo "sin cambios"
          git push
