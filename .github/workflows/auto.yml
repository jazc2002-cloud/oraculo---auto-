name: Auto Oraculo
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python update.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add index.html
          git commit -m "V88.5 verde" || exit 0
          git push
